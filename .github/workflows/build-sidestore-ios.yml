name: Build SideStore iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build full-source unsigned IPA
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Set up CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          xcodebuild -version
          flutter --version
          pod --version

      - name: Build full-source unsigned IPA
        run: python3 scripts/build_ios.py --all-sources

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhenguojian-ios-sidestore
          path: dist/ios/*
          if-no-files-found: error
          retention-days: 14
